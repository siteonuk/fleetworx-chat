name: Deploy Fleetworx AI Chat (Production)

on:
  push:
    branches:
      - prod

permissions:
  contents: read

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  ENVIRONMENT: Production
  IMAGE_TAG: latest
  SERVER_PATH: /opt/fleetworx/fleetworx-chat
  HEALTH_PORT: 3080

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Notify: Deploy Started ─────────────────────────────────────────
      - name: 🔔 Slack — Deploy started
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="$(printf '%s' "$COMMIT_MSG" | head -1)"
          PAYLOAD=$(jq -n --arg env "$ENVIRONMENT" --arg branch "$BRANCH" \
            --arg sha "$SHA" --arg actor "$ACTOR" --arg msg "$TITLE" '{
            blocks: [
              {type:"header",text:{type:"plain_text",text:("🚀 Deploy Started — Fleetworx Chat (" + $env + ")")}},
              {type:"section",fields:[
                {type:"mrkdwn",text:("*Branch:*\n`" + $branch + "`")},
                {type:"mrkdwn",text:("*Commit:*\n`" + $sha + "`")},
                {type:"mrkdwn",text:("*Author:*\n" + $actor)},
                {type:"mrkdwn",text:("*Message:*\n" + $msg)}
              ]},
              {type:"context",elements:[{type:"mrkdwn",text:"⏳ Building Docker image..."}]}
            ]}')
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"

      # ── Build & Push ───────────────────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push Docker image (AMD64 only)
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.multi \
            --target api-build \
            -t ghcr.io/siteonuk/fleetworx-chat:$IMAGE_TAG \
            .
          docker push ghcr.io/siteonuk/fleetworx-chat:$IMAGE_TAG

      - name: 🔔 Slack — Image built
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "blocks": [
              {"type":"context","elements":[{"type":"mrkdwn","text":"📦 Docker image built & pushed — *'"$ENVIRONMENT"'*  |  ⏳ Deploying to server..."}]}
            ]
          }'

      # ── Deploy ─────────────────────────────────────────────────────────
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      # Verify host key before trusting a new host; the workflow only deploys to
      # the known server IP, so a fingerprints mismatch aborts rather than MITM.
      - name: Verify SSH host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H fleetworx.net >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server via SSH
        run: |
          ssh -o StrictHostKeyChecking=yes hardik@fleetworx.net \
            "cd $SERVER_PATH \
            && for i in 1 2 3 4 5; do \
                 echo \"Pull attempt \$i...\"; \
                 docker compose pull api && break; \
                 if [ \$i -eq 5 ]; then echo 'Pull failed after 5 attempts'; exit 1; fi; \
                 echo 'Pull failed (likely transient registry TLS error), retrying in 15s...'; \
                 sleep 15; \
               done \
            && docker compose up -d api"

      - name: 🔔 Slack — Container deployed
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' -d '{
            "blocks": [
              {"type":"context","elements":[{"type":"mrkdwn","text":"🐳 Container updated — *'"$ENVIRONMENT"'*  |  ⏳ Verifying health..."}]}
            ]
          }'

      # ── Verify ─────────────────────────────────────────────────────────
      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 30
          ssh -o StrictHostKeyChecking=yes hardik@fleetworx.net \
            "cd $SERVER_PATH \
            && docker compose ps api \
            && curl -f --retry 3 --retry-delay 5 http://localhost:$HEALTH_PORT/health"

      # ── Notify: Success ────────────────────────────────────────────────
      - name: 🔔 Slack — Deploy success
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="$(printf '%s' "$COMMIT_MSG" | head -1)"
          PAYLOAD=$(jq -n --arg env "$ENVIRONMENT" --arg branch "$BRANCH" \
            --arg actor "$ACTOR" --arg msg "$TITLE" \
            --arg image "ghcr.io/siteonuk/fleetworx-chat:$IMAGE_TAG" '{
            blocks: [
              {type:"header",text:{type:"plain_text",text:("✅ Deploy Successful — Fleetworx Chat (" + $env + ")")}},
              {type:"section",fields:[
                {type:"mrkdwn",text:("*Branch:*\n`" + $branch + "`")},
                {type:"mrkdwn",text:("*Author:*\n" + $actor)},
                {type:"mrkdwn",text:("*Commit:*\n" + $msg)},
                {type:"mrkdwn",text:"*Health:*\n💚 Passing"}
              ]},
              {type:"context",elements:[{type:"mrkdwn",text:("📦 `" + $image + "`")}]}
            ]}')
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"

      # ── Notify: Failure ────────────────────────────────────────────────
      - name: 🔔 Slack — Deploy failed
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="$(printf '%s' "$COMMIT_MSG" | head -1)"
          PAYLOAD=$(jq -n --arg env "$ENVIRONMENT" --arg branch "$BRANCH" \
            --arg actor "$ACTOR" --arg msg "$TITLE" --arg url "$RUN_URL" '{
            blocks: [
              {type:"header",text:{type:"plain_text",text:("❌ Deploy Failed — Fleetworx Chat (" + $env + ")")}},
              {type:"section",fields:[
                {type:"mrkdwn",text:("*Branch:*\n`" + $branch + "`")},
                {type:"mrkdwn",text:("*Author:*\n" + $actor)},
                {type:"mrkdwn",text:("*Commit:*\n" + $msg)},
                {type:"mrkdwn",text:("*Action:*\n<" + $url + "|View Logs>")}
              ]},
              {type:"context",elements:[{type:"mrkdwn",text:"🔴 Check the workflow logs for details"}]}
            ]}')
          curl -s -X POST "$SLACK_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"
